[package]
name = "kipphi-apparatus"
version = "2.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kipphi_apparatus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# 版本要和 npm 那边的 @tauri-apps/api / plugin-* 对齐（Tauri 会校验 major/minor 一致）
tauri = { version = "2.12", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.7"
tracing = "0.1.41"
async-stream = "0.3.6"
futures = "0.3.0"
tauri-plugin-mcp-bridge = "0.13.2"

